# Fork-local CI. Upstream ships no workflow, so this file merges without conflicts.
# Tests are offline by design (AGENTS.md -> Tests): no secrets, no network, no browser.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR updates supersede prior PR runs; distinct push runs must never replace
# each other, including when one is still pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest-shard-0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --frozen python -m pytest -q -p ci_pytest_shard --ci-shard=0 -n auto --durations=25

  pytest-shard-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --frozen python -m pytest -q -p ci_pytest_shard --ci-shard=1 -n auto --durations=25

  pytest-shard-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --frozen python -m pytest -q -p ci_pytest_shard --ci-shard=2 -n auto --durations=25

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/web/*.test.cjs tests/web/*.test.mjs

  checks:
    needs: [pytest-shard-0, pytest-shard-1, pytest-shard-2, node]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs['pytest-shard-0'].result == 'success' }}" = "true"
          test "${{ needs['pytest-shard-1'].result == 'success' }}" = "true"
          test "${{ needs['pytest-shard-2'].result == 'success' }}" = "true"
          test "${{ needs.node.result == 'success' }}" = "true"
