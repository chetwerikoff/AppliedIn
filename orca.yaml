# Orca worktree hooks for AppliedIn (read by Orca from the repo root).
# The main checkout is the operating instance; these hooks only prepare
# task worktrees so an agent never touches the operator's real board.
setupAgentStartupPolicy: wait-for-setup
scripts:
  setup: |
    export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:/usr/local/bin:$PATH"
    set -u
    cd "$ORCA_WORKTREE_PATH" || exit 1

    # Python env for the worktree (uv shares its download cache, so this is fast).
    uv sync --all-groups

    port=$((9000 + $(printf '%s' "$ORCA_WORKTREE_PATH" | cksum | cut -d' ' -f1) % 900))
    # Redis db is 1 + port % 15; the operator instance on 8788 uses db 14 — skip that slot.
    [ $((port % 15)) -eq 13 ] && port=$((port + 1))

    # Never copy primary-checkout settings or follow a stale worktree .env symlink.
    env_tmp=$(mktemp .env.XXXXXXXX) || exit 1
    if ! printf 'APPLIEDIN_WORKTREE_ROOT="%s"\nAPPLIEDIN_WEB_PORT=%s\nAPPLIEDIN_LOCAL_DIR="%s/.local-%s"\nAPPLIEDIN_REDIS_URL=redis://localhost:6379/%s\n' "$ORCA_WORKTREE_PATH" "$port" "$ORCA_WORKTREE_PATH" "$port" "$((1 + port % 15))" > "$env_tmp" ||
       ! mv -fT -- "$env_tmp" .env; then
      rm -f -- "$env_tmp"
      exit 1
    fi
  archive: |
    # Stop anything still running from this worktree (a forgotten daemon or redis-cli).
    target="${ORCA_WORKTREE_PATH%/}"
    [ -n "$target" ] || exit 0
    for p in /proc/[0-9]*; do
      pid="${p##*/}"
      [ "$pid" = "$$" ] && continue
      cwd="$(readlink "$p/cwd" 2>/dev/null)" || continue
      case "$cwd" in
        "$target"|"$target"/*) kill "$pid" 2>/dev/null || true ;;
      esac
    done
